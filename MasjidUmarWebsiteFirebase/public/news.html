<body class="page-home">
	<div id="top"></div>
	<header>

			</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarCollapse">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item">
						<a class="nav-link text-light" href="./index.html">Home</a>
					</li>
					<li class="nav-item active">
						<a class="nav-link text-light" href="news.html">News <span class="sr-only">(current)</span></a>
					</li>
					<li class="nav-item">

					<li class="nav-item">

	<script>
		var date = new Date();
		document.getElementById('date_today').textContent = "Today: " + date.toLocaleDateString();
	</script>

	<section class="hero-banner">
		<h1 class="hero-title">News & Updates</h1>
	</section>

	<main role="main" class="container py-4">
		<section class="section-card mb-4" id="currentNewsSection">
			<h2 id="currentNewsTitle">Stay Updated</h2>
			<p id="currentNewsMessage">Follow the website and join the WhatsApp group for updates.</p>
			<p><a href="https://chat.whatsapp.com/E5j0Ebl8ztZ8VTFhwzYOqb" class="whatsapp-btn" target="_blank" rel="noopener">Join WhatsApp Group</a></p>
		</section>

		<section id="newsArchive"></section>
	</main>

	<footer class="footer-index container-fluid mt-auto">
		<div id="footer" class="footer-row container">
			<div class="footer-col footer-col-left">
				<p class="mb-1"><a href="#top" class="footer-brand">Masjid Umar</a></p>
				<p class="mb-1">
					<a href="https://www.google.com/maps/search/?api=1&query=15+Downs+St+Kingston+NY+12401" target="_blank" rel="noopener">15 Downs St, Kingston, NY 12401</a>
				</p>
			</div>
			<div class="footer-col footer-col-map">
				<iframe
					src="https://maps.google.com/maps?q=15+Downs+St,+Kingston,+NY+12401&output=embed"
					class="footer-map"
					allowfullscreen=""
					loading="lazy"
					referrerpolicy="no-referrer-when-downgrade"
					title="Masjid Umar Location">

			</div>
			<div class="footer-col footer-col-right">
				<p class="mb-1"><a href="mailto:masjidumar15@gmail.com">masjidumar15@gmail.com</a></p>
				<p class="mb-0"><a href="tel:+18454810787">(845) 481-0787</a></p>
			</div>
		</div>
	</footer>

	<script>
		function escapeHtml(str) {
			var div = document.createElement('div');
			div.appendChild(document.createTextNode(str));
			return div.innerHTML;
		}

		// Load current news
		db.ref('news/current').on('value', function(snapshot) {
			var val = snapshot.val();
			if (val) {
				document.getElementById('currentNewsTitle').textContent = val.title || 'Stay Updated';
				document.getElementById('currentNewsMessage').textContent = val.message || '';
			}
		});

		// Load archive (newest first)
		db.ref('news/archive').orderByChild('timestamp').on('value', function(snapshot) {
			var archiveEl = document.getElementById('newsArchive');
			archiveEl.innerHTML = '';
			var items = [];
			snapshot.forEach(function(child) {
				items.push(child.val());
			});
			// Reverse for newest first
			items.reverse();

			if (items.length === 0) return;

			var heading = document.createElement('h2');
			heading.className = 'prayer-times-heading';
			heading.textContent = 'Past Updates';
			archiveEl.appendChild(heading);

			for (var i = 0; i < items.length; i++) {
				var item = items[i];
				var card = document.createElement('div');
				card.className = 'section-card mb-3';

				var dateStr = '';
				if (item.timestamp) {
					var d = new Date(item.timestamp);
					dateStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
				}

				card.innerHTML =
					(dateStr ? '<div class="news-date">' + escapeHtml(dateStr) + '</div>' : '') +
					'<h3>' + escapeHtml(item.title || '') + '</h3>' +
					'<p class="mb-0">' + escapeHtml(item.message || '') + '</p>';
				archiveEl.appendChild(card);
			}
		});
	</script>
</body>
</html>
