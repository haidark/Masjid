<!DOCTYPE HTML>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8">
	<title>Display - Masjid Umar</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

	<script type="text/javascript" src="PrayTimes.js"></script>
	<script type="text/javascript" src="moment.js"></script>
	<script type="text/javascript" src="jamaatify.js"></script>
	<script type="text/javascript" src="hijridate.js"></script>
	<script type="text/javascript" src="showdate.js"></script>
	<script type="text/javascript" src="countdown.js"></script>
	<script type="text/javascript" src="taraweeh.js"></script>
	<script type="text/javascript" src="clock.js" defer></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
	<script src="firebase-config.js"></script>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #fdf9f1;
			color: #1a1a1a;
			font-family: 'Times New Roman', Times, serif;
			font-weight: 400;
		}

		/* ===== Main grid: fills entire viewport ===== */
		.live-grid {
			display: grid;
			grid-template-rows: auto 1fr auto;
			width: 100vw;
			height: 100vh;
			padding: 1vh 1.5vw;
			gap: 0.8vh;
		}

		/* ===== BUTTON GROUP OVERLAY: hides together in fullscreen ===== */
		.btn-group-overlay {
			position: fixed;
			top: 1vh;
			right: 1vw;
			z-index: 100;
			display: flex;
			align-items: center;
			gap: 0.5em;
		}
		.btn-group-overlay.hidden {
			display: none;
		}

		/* CSS-level fullscreen hide (Fullscreen API, all browsers) */
		:fullscreen .btn-group-overlay,
		:-webkit-full-screen .btn-group-overlay,
		:-moz-full-screen .btn-group-overlay {
			display: none !important;
		}

		/* ===== HOME BUTTON ===== */
		.home-btn {
			padding: 0.4em 1em;
			background: #7e4544;
			color: #fdf9f1;
			border: none;
			border-radius: 6px;
			font-size: clamp(0.65rem, 1.6vmin, 1.6rem);
			font-weight: 600;
			text-decoration: none;
			cursor: pointer;
			transition: background 0.2s;
		}

		.home-btn:hover {
			background: #5c3232;
			color: #fdf9f1;
			text-decoration: none;
		}

		/* ===== TOP BAR: Date, Hijri, Time - all centered ===== */
		.top-bar {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.2vh;
		}

		#MyClockDisplay {
			font-size: clamp(2.25rem, 10vmin, 11.25rem);
			font-weight: 400;
			font-variant-numeric: tabular-nums;
			color: #1a1a1a;
			letter-spacing: 2px;
			line-height: 1;
			text-align: center;
		}

		#MyDateDisplay {
			font-size: clamp(1rem, 3.75vmin, 4.4rem);
			font-weight: 700;
			color: #7e4544;
			white-space: nowrap;
			text-align: center;
			max-width: 96vw;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#hijridateval {
			font-size: clamp(0.9rem, 3vmin, 3.5rem);
			color: #9c6b3a;
			white-space: nowrap;
			text-align: center;
			max-width: 96vw;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* ===== MIDDLE: Table fills remaining space, countdown below ===== */
		.middle-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-start;
			min-height: 0;
			gap: 0.4vh;
			width: 100%;
		}

		/* Prayer table: grows to fill available vertical space */
		.prayer-table-wrap {
			overflow: hidden;
			min-height: 0;
			max-width: 100%;
			flex: 1 1 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
		}

		#containerDiv {
			height: 100%;
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		#containerDiv table {
			height: 100%;
			width: 100%;
			margin: 0 auto;
			border-collapse: collapse;
		}

		#containerDiv .caption {
			font-size: clamp(0.75rem, 3vmin, 3rem);
			font-weight: 700;
			color: #000000;
			text-align: center;
			padding: 0.6vh 0;
			background: #e2c390;
			border-bottom: 2px solid #c9a86c;
		}

		#containerDiv .head-row td {
			background: #d4b896;
			color: #000000;
			font-weight: 700;
			font-size: clamp(0.6rem, 2.4vmin, 2.4rem);
			padding: clamp(2px, 0.8vh, 10px) clamp(4px, 1vw, 16px);
			text-align: center;
			border: 1px solid #b89b6a;
		}

		#containerDiv tr td {
			font-size: clamp(0.55rem, 2.2vmin, 2.2rem);
			padding: clamp(2px, 0.7vh, 9px) clamp(4px, 1vw, 14px);
			text-align: center;
			color: #000000;
			font-weight: 500;
			border: 1px solid #ccc;
		}

		#containerDiv tr:nth-child(odd) td {
			background: #ffffff;
		}

		#containerDiv tr:nth-child(even) td {
			background: #f5ebe0;
		}

		/* Today's row highlight */
		#containerDiv tr.bg-dark td,
		#containerDiv tr.bg-dark.text-light td {
			background: #fff3cd !important;
			color: #000000 !important;
			font-weight: 700;
		}

		/* Countdown section */
		#countdowntxt {
			text-align: center;
			color: rgb(22, 11, 93);
			font-size: clamp(0.95rem, 3.5vmin, 3.75rem);
			letter-spacing: 1px;
		}

		#jummahLiveDisplay {
			text-align: center;
			font-size: clamp(0.95rem, 3.1vmin, 3.25rem);
			color: #7e4544;
			letter-spacing: 1px;
		}

		#myLink {
			text-align: center;
			color: rgba(33, 6, 240, 0.924);
			font-size: clamp(2.25rem, 9.4vmin, 10rem);
			letter-spacing: 1px;
			line-height: 1.1;
		}

		/* ===== BOTTOM BAR: Logo + QR codes ===== */
		.bottom-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 2vw;
			padding-top: 0.5vh;
			border-top: 2px solid #e2c390;
		}

		.logo-section {
			display: flex;
			align-items: center;
			gap: 1vw;
		}

		.logo-section img {
			height: clamp(36px, 7vh, 90px);
			width: auto;
		}

		.logo-text {
			font-size: clamp(0.8rem, 2vmin, 2rem);
			font-weight: 700;
			color: #7e4544;
			line-height: 1.2;
		}

		.logo-text span {
			display: block;
			font-size: 0.6em;
			color: #9c6b3a;
			font-weight: 400;
		}

		.qr-section {
			display: flex;
			align-items: center;
			gap: 2vw;
		}

		.qr-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5vh;
		}

		.qr-item img,
		.qr-placeholder {
			height: clamp(44px, 8.5vh, 110px);
			width: clamp(44px, 8.5vh, 110px);
			object-fit: contain;
			border-radius: 6px;
			background: #ffffff;
			padding: 4px;
			border: 1px solid #e2c390;
		}

		.qr-placeholder {
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 0.6rem;
			color: #666;
			text-align: center;
		}

		.qr-label {
			font-size: clamp(0.5rem, 1.4vmin, 1.4rem);
			color: #7e4544;
			text-align: center;
		}

		/* ===== B&W Toggle Button ===== */
		.bw-toggle-btn {
			padding: 0.4em 0.8em;
			background: #555;
			color: #fff;
			border: none;
			border-radius: 6px;
			font-size: clamp(0.6rem, 1.4vmin, 1.4rem);
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s;
		}
		.bw-toggle-btn:hover {
			background: #333;
		}

		/* ===== Fullscreen Button ===== */
		.fs-btn {
			padding: 0.4em 0.8em;
			background: #7e4544;
			color: #fdf9f1;
			border: none;
			border-radius: 6px;
			font-size: clamp(0.6rem, 1.4vmin, 1.4rem);
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s;
		}
		.fs-btn:hover { background: #5c3232; }

		/* ===== Exit Fullscreen Button (touch devices) ===== */
		.exit-fs-btn {
			opacity: 0;
			pointer-events: none;
			position: fixed;
			top: 1vh;
			right: 1vw;
			z-index: 200;
			padding: 0.4em 0.8em;
			background: rgba(126,69,68,0.9);
			color: #fdf9f1;
			border: none;
			border-radius: 6px;
			font-size: clamp(0.55rem, 1.3vmin, 1.3rem);
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.3s;
		}
		.exit-fs-btn.visible {
			opacity: 1;
			pointer-events: auto;
		}

		/* ===== B&W Mode Overrides ===== */
		body.bw-mode {
			background: #ffffff !important;
		}
		body.bw-mode #MyClockDisplay {
			color: #000000 !important;
		}
		body.bw-mode #MyDateDisplay {
			color: #333333 !important;
		}
		body.bw-mode #hijridateval {
			color: #555555 !important;
		}
		body.bw-mode #containerDiv .caption {
			background: #333333 !important;
			color: #000000 !important;
			border-bottom-color: #333333 !important;
		}
		body.bw-mode #containerDiv .head-row td {
			background: #555555 !important;
			color: #000000 !important;
			border-color: #444444 !important;
		}
		body.bw-mode #containerDiv tr td {
			color: #000000 !important;
			border-color: #cccccc !important;
		}
		body.bw-mode #containerDiv tr:nth-child(odd) td {
			background: #ffffff !important;
		}
		body.bw-mode #containerDiv tr:nth-child(even) td {
			background: #f0f0f0 !important;
		}
		body.bw-mode #containerDiv tr.bg-dark td,
		body.bw-mode #containerDiv tr.bg-dark.text-light td {
			background: #dddddd !important;
			color: #000000 !important;
		}
		body.bw-mode .bottom-bar {
			border-top-color: #cccccc !important;
		}
		body.bw-mode .logo-text {
			color: #000000 !important;
		}
		body.bw-mode .logo-text span {
			color: #555555 !important;
		}
		body.bw-mode #jummahLiveDisplay {
			color: #333333 !important;
		}
		body.bw-mode .qr-label {
			color: #333333 !important;
		}
		body.bw-mode .qr-item img,
		body.bw-mode .qr-placeholder {
			border-color: #cccccc !important;
		}
		body.bw-mode .btn-group-overlay .home-btn {
			background: #333333 !important;
			color: #ffffff !important;
		}
		body.bw-mode .bw-toggle-btn {
			background: #7e4544;
		}
		body.bw-mode .fs-btn {
			background: #333333 !important;
			color: #ffffff !important;
		}

		/* Very small screens */
		@media (max-height: 500px) {
			.live-grid {
				padding: 0.5vh 1vw;
				gap: 0.5vh;
			}
		}

		/* Large / wide screens */
		@media (min-width: 1920px) {
			.live-grid {
				padding: 2vh 3vw;
			}
		}

		/* Portrait orientation */
		@media (orientation: portrait) {
			.qr-item img,
			.qr-placeholder {
				height: clamp(36px, 7vh, 95px);
				width: clamp(36px, 7vh, 95px);
			}
			.logo-section img {
				height: clamp(28px, 6vh, 80px);
			}
			.middle-section {
				justify-content: space-between;
			}
			#countdowntxt {
				font-size: clamp(1.1rem, 5.6vw, 3.1rem);
			}
			#myLink {
				font-size: clamp(2rem, 15vw, 8.75rem);
			}
			.live-grid {
				padding: 0.8vh 1.5vw;
				gap: 0.5vh;
			}
		}

		/* Very narrow portrait phones */
		@media (orientation: portrait) and (max-width: 480px) {
			#containerDiv .head-row td,
			#containerDiv tr td {
				font-size: clamp(0.5rem, 2.5vw, 1.5rem);
				padding: clamp(1px, 0.5vh, 6px) clamp(2px, 0.8vw, 8px);
			}
			.bottom-bar {
				gap: 1vw;
			}
		}
	</style>
</head>
<body>

<!-- Button group: hidden together in fullscreen (F11 or API) -->
<div class="btn-group-overlay" id="btnGroupOverlay">
	<button class="fs-btn" id="fsBtn">&#x26F6; Fullscreen</button>
	<button class="bw-toggle-btn" id="bwToggleBtn">B&W</button>
	<a href="./index.html" class="home-btn" id="homeBtn">Home</a>
</div>

<!-- Exit fullscreen button: fades in when cursor/touch nears top-right corner -->
<button class="exit-fs-btn" id="exitFsBtn">&#x2716; Exit</button>

<div class="live-grid">

	<!-- TOP BAR: Clock, Date, Hijri - centered -->
	<div class="top-bar">
		<div id="MyClockDisplay" onload="showTime()"></div>
		<div id="MyDateDisplay" onload="showDate()"></div>
		<div id="hijridateval" onload="showHijri()"></div>
	</div>

	<!-- MIDDLE: Table centered, countdown below -->
	<div class="middle-section">
		<div class="prayer-table-wrap">
			<div id="containerDiv"></div>
		</div>
		<div id="jummahLiveDisplay">Jummah Khutbah: 12:45 PM</div>
		<div id="countdowntxt"></div>
		<div id="myLink" onload="countdown(fajr,dhuhr,asr,maghrib,isha)"></div>
	</div>

	<!-- BOTTOM BAR -->
	<div class="bottom-bar">
		<div class="logo-section">
			<img src="Umar.png" alt="Masjid Umar">
			<div class="logo-text">
				Masjid Umar
				<span>Kingston, NY</span>
			</div>
		</div>
		<div class="qr-section">
			<div class="qr-item">
				<img src="qrmasjid.png" alt="Website QR">
				<div class="qr-label">masjidumar.us</div>
			</div>
			<div class="qr-item">
				<img src="qrwhatsapp.jpeg" alt="WhatsApp QR">
				<div class="qr-label">WhatsApp</div>
			</div>
		</div>
	</div>

</div>

<script type="text/javascript">
	// Fullscreen detection: covers both F11 and Fullscreen API
	var btnGroupOverlay = document.getElementById('btnGroupOverlay');
	var bwToggleBtn = document.getElementById('bwToggleBtn');
	var exitFsBtn = document.getElementById('exitFsBtn');
	var exitFsHideTimer;
	var inFullscreen = false;

	function showExitBtn() {
		clearTimeout(exitFsHideTimer);
		exitFsBtn.classList.add('visible');
	}
	function scheduleHideExitBtn() {
		clearTimeout(exitFsHideTimer);
		exitFsHideTimer = setTimeout(function () {
			exitFsBtn.classList.remove('visible');
		}, 1000);
	}

	// Show exit button when cursor is in top-right corner area
	document.addEventListener('mousemove', function (e) {
		if (!inFullscreen) return;
		var nearRight = (window.innerWidth - e.clientX) < 160;
		var nearTop = e.clientY < 100;
		if (nearRight && nearTop) {
			showExitBtn();
		} else {
			scheduleHideExitBtn();
		}
	});

	// Touch: tap near top-right corner to reveal
	document.addEventListener('touchstart', function (e) {
		if (!inFullscreen) return;
		var touch = e.touches[0];
		var nearRight = (window.innerWidth - touch.clientX) < 160;
		var nearTop = touch.clientY < 100;
		if (nearRight && nearTop) {
			showExitBtn();
			scheduleHideExitBtn();
		}
	});

	function checkFullscreen() {
		var isApiFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
		var isF11Fullscreen = (
			Math.abs(window.innerHeight - screen.height) <= 5 &&
			Math.abs(window.innerWidth - screen.width) <= 5
		);
		inFullscreen = isApiFullscreen || isF11Fullscreen;
		if (inFullscreen) {
			btnGroupOverlay.classList.add('hidden');
		} else {
			btnGroupOverlay.classList.remove('hidden');
			clearTimeout(exitFsHideTimer);
			exitFsBtn.classList.remove('visible');
		}
	}
	// Listen for Fullscreen API changes
	document.addEventListener('fullscreenchange', checkFullscreen);
	document.addEventListener('webkitfullscreenchange', checkFullscreen);
	document.addEventListener('mozfullscreenchange', checkFullscreen);
	document.addEventListener('MSFullscreenChange', checkFullscreen);
	// Listen for F11 fullscreen (resize-based detection)
	window.addEventListener('resize', checkFullscreen);
	// Initial check
	checkFullscreen();

	var currentDate = new Date();
	var timeFormat = 1;
	var monthTable = document.createElement("table");
	monthTable.id = "table" + (currentDate.getMonth()).toString();
	monthTable.setAttribute("class", "table-striped");
	monthTable.appendChild(displayMonth(currentDate.getMonth()));
	setInterval(function () {
		monthTable.firstChild.remove();
		monthTable.appendChild(displayMonth(currentDate.getMonth()));
	}, 3600000);

	document.getElementById("containerDiv").appendChild(monthTable);
	var fajr, ndfajar, dhuhr, asr, maghrib, isha;

	function displayMonth(monthID) {
		monthID = monthID !== undefined ? monthID : 0;
		var lat = 41.9270;
		var lng = -73.9974;
		var timeZone = -5;
		var dst = 'auto';
		var method = 'ISNA';

		prayTimes.setMethod(method);
		currentDate.setMonth(monthID);
		var month = currentDate.getMonth();
		var year = currentDate.getFullYear();
		return makeTable(year, month, lat, lng, timeZone, dst);
	}

	function makeTable(year, month, lat, lng, timeZone, dst) {
		var items = {
			day: 'Day', fajr: 'Fajr', sunrise: 'Sunrise',
			dhuhr: 'Dhuhr', asr: 'Asr', maghrib: 'Maghrib', isha: 'Isha'
		};
		var tbody = document.createElement('tbody');
		var monthHeadertr = document.createElement('tr');
		var monthHeadertd = document.createElement('td');
		monthHeadertd.innerHTML = monthFullName(month) + ' ' + year;
		monthHeadertd.colSpan = 7;
		monthHeadertd.setAttribute("class", "caption");
		monthHeadertr.appendChild(monthHeadertd);
		tbody.appendChild(monthHeadertr);
		tbody.appendChild(makeTableRow(items, items, 'head-row'));

		var date = new Date(year, month, currentDate.getDate());
		var endDate = new Date(year, month, currentDate.getDate() + 7);
		while (date < endDate) {
			prayTimes.setMethod('ISNA');
			var times = prayTimes.getTimes(date, [41.9270, -73.9974], -5, 'auto', '12hNS');
			jamaatify(times);
			times.day = date.getDate();
			var isToday = (date.getMonth() === currentDate.getMonth()) && (date.getDate() === currentDate.getDate());
			if (isToday) {
				fajr = times.fajr;
				dhuhr = times.dhuhr;
				asr = times.asr;
				maghrib = times.maghrib;
				isha = times.isha;
			}
			if (times.day === currentDate.getDate() + 1 || times.day === 1) {
				ndfajar = times.fajr;
			}
			var klass = isToday ? 'bg-dark text-light' : '';
			tbody.appendChild(makeTableRow(times, items, klass));
			date.setDate(date.getDate() + 1);
		}
		return tbody;
	}

	function makeTableRow(data, items, klass) {
		var row = document.createElement('tr');
		for (var i in items) {
			var cell = document.createElement('td');
			cell.innerHTML = data[i];
			row.appendChild(cell);
		}
		row.className = klass;
		return row;
	}

	function removeAllChild(node) {
		if (node == undefined || node == null) return;
		while (node.firstChild) node.removeChild(node.firstChild);
	}

	function switchFormat(offset) {
		var formats = ['24-hour', '12-hour'];
		timeFormat = (timeFormat + offset) % 2;
		$('time-format').innerHTML = formats[timeFormat];
		update();
	}

	function update() {
		displayMonth(0);
	}

	function monthFullName(month) {
		var monthName = new Array('January', 'February', 'March', 'April', 'May', 'June',
			'July', 'August', 'September', 'October', 'November', 'December');
		return monthName[month];
	}

	function $(id) {
		return document.getElementById(id);
	}

	// B&W toggle: persist in localStorage
	if (localStorage.getItem('masjidUmar_bwMode') === 'true') {
		document.body.classList.add('bw-mode');
	}
	bwToggleBtn.addEventListener('click', function() {
		document.body.classList.toggle('bw-mode');
		localStorage.setItem('masjidUmar_bwMode', document.body.classList.contains('bw-mode'));
	});

	function fitTableToContainer() {
		var wrap = document.querySelector('.prayer-table-wrap');
		var tbody = monthTable.querySelector('tbody');
		var minRows = 4;

		function getDataRows() {
			var allRows = tbody.querySelectorAll('tr');
			var dataRows = [];
			for (var i = 2; i < allRows.length; i++) dataRows.push(allRows[i]);
			return dataRows;
		}

		monthTable.style.height = 'auto';
		var dataRows = getDataRows();
		while (monthTable.offsetHeight > wrap.offsetHeight && dataRows.length > minRows) {
			tbody.removeChild(dataRows[dataRows.length - 1]);
			dataRows.pop();
		}
		monthTable.style.height = '100%';
	}

	window.onload = function () {
		var myLinkEl = document.getElementById("myLink");
		if (myLinkEl && typeof countdown === 'function' && fajr && ndfajar) {
			countdown(fajr, dhuhr, asr, maghrib, isha, ndfajar);
		}
		var countdowntxtEl = document.getElementById("countdowntxt");
		if (countdowntxtEl) countdowntxtEl.innerHTML = "Next prayer time in:";
	};

	// ResizeObserver fires whenever .prayer-table-wrap height settles,
	// including after images/fonts load — more reliable than window.onload
	var lastWrapHeight = 0;
	var wrapObserver = new ResizeObserver(function () {
		var h = document.querySelector('.prayer-table-wrap').offsetHeight;
		if (h === lastWrapHeight) return;
		lastWrapHeight = h;
		monthTable.firstChild.remove();
		monthTable.appendChild(displayMonth(currentDate.getMonth()));
		fitTableToContainer();
	});
	wrapObserver.observe(document.querySelector('.prayer-table-wrap'));

	var resizeTimer;
	window.addEventListener('resize', function () {
		clearTimeout(resizeTimer);
		resizeTimer = setTimeout(function () {
			monthTable.firstChild.remove();
			monthTable.appendChild(displayMonth(currentDate.getMonth()));
			fitTableToContainer();
		}, 150);
	});
	// Fullscreen button logic
	var fsBtn = document.getElementById('fsBtn');
	var fsApiAvailable = !!(
		document.documentElement.requestFullscreen ||
		document.documentElement.webkitRequestFullscreen ||
		document.documentElement.mozRequestFullScreen ||
		document.documentElement.msRequestFullscreen
	);
	if (!fsApiAvailable) {
		// iOS Safari: API not available — guide user to Add to Home Screen
		fsBtn.textContent = 'Add to Home Screen for Fullscreen';
		fsBtn.style.fontSize = 'clamp(0.5rem, 1.1vmin, 1.1rem)';
	}
	fsBtn.addEventListener('click', function () {
		if (!fsApiAvailable) return;
		var el = document.documentElement;
		if (el.requestFullscreen)            el.requestFullscreen();
		else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
		else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
		else if (el.msRequestFullscreen)     el.msRequestFullscreen();
	});
	exitFsBtn.addEventListener('click', function () {
		if (document.exitFullscreen)            document.exitFullscreen();
		else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
		else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
		else if (document.msExitFullscreen)     document.msExitFullscreen();
	});

	db.ref('jummahTime').on('value', function(snapshot) {
		var val = snapshot.val();
		var el = document.getElementById('jummahLiveDisplay');
		if (el) el.textContent = 'Jummah Khutbah: ' + (val || '12:45 PM');
	});
</script>

</body>
</html>
