<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - Masjid Umar</title>
  <style>
    :root {
      --bg-color: rgba(72, 121, 122, 0.555);
      --edge-color: rgba(238, 238, 238, 0.651);
    }
    body {
      background: var(--bg-color);
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #message {
      background: var(--edge-color);
      max-width: 400px;
      margin: 80px auto 20px;
      padding: 32px 24px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }
    #message h2 { color: #343a40; font-size: 2em; margin: 0 0 8px; }
    #message h1 { font-size: 1.5em; font-weight: 600; color: rgba(0,0,0,0.8); margin: 0 0 16px; }
    #message p { line-height: 1.5; margin: 16px 0; font-size: 14px; }
    #message .home-link {
      display: inline-block;
      margin-top: 16px;
      background: #343a40;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 4px;
    }
    #message .home-link:hover { background: #23272b; color: white; }
  </style>
</head>
<body>
  <div id="message">
    <h2>404</h2>
    <h1>Page Not Found</h1>
    <p>The specified file was not found on this website. Please check the URL and try again.</p>
    <p><a href="/index.html" class="home-link">Masjid Umar – Back to Home</a></p>
  </div>
</body>
</html>
