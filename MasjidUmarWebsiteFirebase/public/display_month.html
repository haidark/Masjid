<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8">
	<title>Display - Masjid Umar</title>
	<link rel="stylesheet" href="Umar.css" type="text/css">
	
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
	
	
	<script type="text/javascript" src="PrayTimes.js"></script> 
	<script type="text/javascript" src="moment.js"></script>  
	<script type="text/javascript" src="jamaatify.js"></script>
	<script type="text/javascript" src="hijridate.js"></script>
	<script type="text/javascript" src="showdate.js"></script>
	<script type="text/javascript" src="countdown.js"></script>
	<script type="text/javascript" src="taraweeh.js"></script>
</head>
	<style>
		body{
			overflow: hidden;
		}
	 tr, td, table{
		max-height: 48vh;
		min-width: 100%;
		padding-bottom: 10;
	}
	</style>
<body>


<br>
<div style="line-height:300%">
	<div id="MyClockDisplay" class="text-center"  onload="showTime()" style="color: black;font-size: 800%;font-family: Orbitron;letter-spacing: 1px;"></div>
	<p></p>
	<div id="MyDateDisplay" class="text-center"  onload="showDate()" style="color:black;font-size: 250%;font-family: Orbitron;letter-spacing: 0.5px;"></div>
	<div id="MytitleDisplay" class="text-center display-title"></div>
	<div id="hijridateval" class="text-center" style="color: black; font-size: 250%; font-family: Orbitron; letter-spacing: 1px;"></div>
	
</div>


<br>
	<div class="container" id="containerDiv"></div>
	
	<br>
	
	<script type="text/javascript">
		
		var currentDate = new Date();
		var timeFormat = 1; 
		var monthTable = document.createElement("table");
		monthTable.id = "table"+(currentDate.getMonth()).toString();
		monthTable.setAttribute("class", "d-flex justify-content-center table-striped ");
		monthTable.appendChild(displayMonth(currentDate.getMonth()));
		setInterval(function(){ monthTable.firstChild.remove(); 
			monthTable.appendChild(displayMonth(currentDate.getMonth()));}, 3600000);

		document.getElementById("containerDiv").appendChild(monthTable);
		var fajr, ndfajar, dhuhr, asr, maghrib, isha;
		function displayMonth(monthID) {
			monthID = monthID !== undefined ? monthID : 0;
			var lat = 41.9270;
			var lng = -73.9974;
			var timeZone = -5;
			var dst = 'auto';
			var method ='ISNA';
	
			prayTimes.setMethod(method);
			currentDate.setMonth(monthID);
			var month = currentDate.getMonth();
			var year = currentDate.getFullYear();
			return makeTable(year, month, lat, lng, timeZone, dst);
		}
		// make monthly timetable


		function makeTable(year, month, lat, lng, timeZone, dst) {
			var items = {day: 'Day', fajr: 'Fajr', sunrise: 'Sunrise',
						dhuhr: 'Dhuhr', asr: 'Asr', maghrib: 'Maghrib', isha: 'Isha'};
			var tbody = document.createElement('tbody');
			var monthHeadertr = document.createElement('tr');
			var monthHeadertd = document.createElement('td');
			monthHeadertd.innerHTML = monthFullName(month) + ' ' + year;
			monthHeadertd.style.fontSize = "350%";
			monthHeadertd.colSpan = 7;
			monthHeadertd.setAttribute("class", "caption");
			monthHeadertr.appendChild(monthHeadertd);
			tbody.appendChild(monthHeadertr);
			tbody.appendChild(makeTableRow(items, items, 'head-row'));

			var date = new Date(year, month, currentDate.getDate());
			var endDate = new Date(year, month, currentDate.getDate() + 7);
			while (date < endDate) {
				prayTimes.setMethod('ISNA');
				var times = prayTimes.getTimes(date, [41.9270, -73.9974], -5, 'auto', '12hNS');
				jamaatify(times);
				times.day = date.getDate();
				var isToday = (date.getMonth() === currentDate.getMonth()) && (date.getDate() === currentDate.getDate());
				if (isToday) {
					fajr = times.fajr;
					dhuhr = times.dhuhr;
					asr = times.asr;
					maghrib = times.maghrib;
					isha = times.isha;
				}
				if (times.day === currentDate.getDate() + 1 || times.day === 1) {
					ndfajar = times.fajr;
				}
				var klass = isToday ? 'bg-dark text-light' : '';
				tbody.appendChild(makeTableRow(times, items, klass));
				date.setDate(date.getDate() + 1);
			}
			return tbody;
		}
		
		// make a table row
		function makeTableRow(data, items, klass) {
			var row = document.createElement('tr');
			for (var i in items) {
				var cell = document.createElement('td');
				cell.innerHTML = data[i];
				cell.style.width = i=='day' ? '1vh' : '10vh';
				cell.style.height = i=='day' ? '1vh' : '4.8vh';
				cell.style.fontSize = "205%";
				row.appendChild(cell);
			
			}
			row.className = klass;
			return row;		
		}
	
		// remove all children of a node
		function removeAllChild(node) {
			if (node == undefined || node == null)
				return;
	
			while (node.firstChild)
				node.removeChild(node.firstChild);
		}
	
		// switch time format
		function switchFormat(offset) {
			var formats = ['24-hour', '12-hour'];
			timeFormat = (timeFormat+ offset)% 2;
			$('time-format').innerHTML = formats[timeFormat];
			update();
		}
	
		// update table
		function update() {
			displayMonth(0);
		}
	
		// return month full name
		function monthFullName(month) {
			var monthName = new Array('January','February ', 'March', 'April', 'May', 'June', 
							'July', 'August', 'September', 'October', 'November', 'December');
			return monthName[month];
		}
		
		function $(id) {
			return document.getElementById(id);
			
		}
		
		window.onload = function() {
			var myLinkEl = document.getElementById("myLink");
			if (myLinkEl && typeof countdown === 'function') {
				myLinkEl.innerHTML = countdown(fajr, dhuhr, asr, maghrib, isha);
			}
			var countdowntxtEl = document.getElementById("countdowntxt");
			if (countdowntxtEl) countdowntxtEl.innerHTML = "Next prayer time in:";
			var reciterEl = document.getElementById("reciter");
			if (reciterEl) reciterEl.innerHTML = "Today's Taraweeh Reciters:";
			var threeEl = document.getElementById("three");
			if (threeEl) threeEl.innerHTML = "Second:Mudasir";
			var fiveEl = document.getElementById("five");
			if (fiveEl) fiveEl.innerHTML = "Third:Fawad";
			var sevenEl = document.getElementById("seven");
			if (sevenEl) sevenEl.innerHTML = "Fourth:Badran";
			var nineEl = document.getElementById("nine");
			if (nineEl) nineEl.innerHTML = "Fifth:Badran";
			var hijridatetxtEl = document.getElementById("hijridatetxt");
			if (hijridatetxtEl) hijridatetxtEl.innerHTML = "Hijri Date :";
		};

		function showscrapeWeb() {
			var el = document.getElementById("MytitleDisplay");
			if (!el) return;
			fetch("output.html").then(function(r) { return r.text(); }).then(function(html) {
				var parser = new DOMParser();
				var doc = parser.parseFromString(html, "text/html");
				var h1 = doc.querySelector("h1");
				if (h1) el.textContent = h1.textContent.trim();
			}).catch(function() {});
		}
		showscrapeWeb();
		setInterval(showscrapeWeb, 60000);
	</script>




	

<div id="countdowntxt" class="text-center" style="margin-top:10%;color: rgb(22, 11, 93); font-size: 450%; font-family: Orbitron; letter-spacing: 1px;"></div>

<div id="myLink" class="text-center" onload="countdown(fajr,dhuhr,asr,maghrib,isha)" style="margin: -8%;color: rgba(33, 6, 240, 0.924);font-size: 800%;font-family: Orbitron;letter-spacing: 1px;"  ></div>
<div id="second" class="text-center" style="margin-bottom:0%;color: rgb(14, 13, 13); font-size: 111%; font-family: Orbitron; letter-spacing: 1px;"></div>




<img id="masjidLogo" class="img-responsive" src="Umar.png" width="20%" height="20%" alt="Masjid Umar">






</body>
